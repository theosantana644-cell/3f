openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API do delivery de lanches
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: store
    description: Cardápio e configurações públicas
  - name: admin
    description: Administração da loja
  - name: orders
    description: Pedidos
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /store:
    get:
      operationId: getStore
      tags: [store]
      summary: Obter configurações públicas da loja
      responses:
        "200":
          description: Loja e produtos ativos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreView"
  /admin/status:
    get:
      operationId: getAdminStatus
      tags: [admin]
      summary: Verificar configuração e sessão administrativa
      responses:
        "200":
          description: Estado administrativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
  /admin/setup:
    post:
      operationId: setupAdmin
      tags: [admin]
      summary: Criar a primeira senha administrativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordInput"
      responses:
        "200":
          description: Administrador configurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
        "409":
          description: A senha já foi configurada
  /admin/login:
    post:
      operationId: loginAdmin
      tags: [admin]
      summary: Entrar no painel administrativo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordInput"
      responses:
        "200":
          description: Sessão iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
        "401":
          description: Senha inválida
  /admin/logout:
    post:
      operationId: logoutAdmin
      tags: [admin]
      summary: Encerrar a sessão administrativa
      responses:
        "200":
          description: Sessão encerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /admin/store:
    patch:
      operationId: updateStore
      tags: [admin]
      summary: Atualizar dados da loja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "200":
          description: Configurações atualizadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
        "401":
          description: Acesso administrativo necessário
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: Listar todos os produtos para administração
      responses:
        "200":
          description: Produtos ativos e inativos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Acesso administrativo necessário
    post:
      operationId: createProduct
      tags: [admin]
      summary: Adicionar produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Acesso administrativo necessário
  /admin/products/{id}:
    put:
      operationId: updateProduct
      tags: [admin]
      summary: Atualizar produto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Acesso administrativo necessário
        "404":
          description: Produto não encontrado
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Excluir produto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Produto excluído
        "401":
          description: Acesso administrativo necessário
        "404":
          description: Produto não encontrado
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Salvar pedido da loja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Pedido salvo para envio ao WhatsApp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: Consultar pedidos recebidos
      responses:
        "200":
          description: Pedidos mais recentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Acesso administrativo necessário
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProductCategory:
      type: string
      enum: [CREPES, MINI_PASTEIS_6, MINI_PASTEIS_12, BATATA]
    Flavor:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
      required: [name, quantity]
    Extra:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
          minimum: 0
      required: [name, price]
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
        imageUrl:
          type: ["string", "null"]
        category:
          $ref: "#/components/schemas/ProductCategory"
        active:
          type: boolean
        unitCount:
          type: ["integer", "null"]
        flavors:
          type: array
          items:
            type: string
        extras:
          type: array
          items:
            $ref: "#/components/schemas/Extra"
      required: [id, name, description, price, imageUrl, category, active, unitCount, flavors, extras]
    ProductInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          minimum: 0
        imageUrl:
          type: ["string", "null"]
        category:
          $ref: "#/components/schemas/ProductCategory"
        active:
          type: boolean
        unitCount:
          type: ["integer", "null"]
        flavors:
          type: array
          items:
            type: string
        extras:
          type: array
          items:
            $ref: "#/components/schemas/Extra"
      required: [name, description, price, imageUrl, category, active, unitCount, flavors, extras]
    StoreSettings:
      type: object
      properties:
        name:
          type: string
        tagline:
          type: string
        logoUrl:
          type: ["string", "null"]
        whatsappNumber:
          type: string
        deliveryFee:
          type: number
      required: [name, tagline, logoUrl, whatsappNumber, deliveryFee]
    StoreView:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/StoreSettings"
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
      required: [settings, products]
    StoreInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        tagline:
          type: string
        logoUrl:
          type: ["string", "null"]
        whatsappNumber:
          type: string
        deliveryFee:
          type: number
          minimum: 0
      required: [name, tagline, logoUrl, whatsappNumber, deliveryFee]
    AdminStatus:
      type: object
      properties:
        setupRequired:
          type: boolean
        authenticated:
          type: boolean
      required: [setupRequired, authenticated]
    AdminPasswordInput:
      type: object
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 128
      required: [password]
    ActionResult:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    OrderFlavor:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
      required: [name, quantity]
    OrderLineInput:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1
        flavors:
          type: array
          items:
            $ref: "#/components/schemas/OrderFlavor"
        extras:
          type: array
          items:
            type: string
        notes:
          type: string
      required: [productId, quantity, flavors, extras, notes]
    OrderInput:
      type: object
      properties:
        customerName:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 8
        fulfillment:
          type: string
          enum: [DELIVERY, PICKUP]
        address:
          type: string
        reference:
          type: string
        notes:
          type: string
        paymentMethod:
          type: string
          enum: [CASH, PIX, CARD]
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLineInput"
      required: [customerName, phone, fulfillment, address, reference, notes, paymentMethod, items]
    OrderLine:
      type: object
      properties:
        productId:
          type: integer
        name:
          type: string
        unitPrice:
          type: number
        quantity:
          type: integer
        subtotal:
          type: number
        flavors:
          type: array
          items:
            $ref: "#/components/schemas/OrderFlavor"
        extras:
          type: array
          items:
            $ref: "#/components/schemas/Extra"
        notes:
          type: string
      required: [productId, name, unitPrice, quantity, subtotal, flavors, extras, notes]
    Order:
      type: object
      properties:
        id:
          type: integer
        customerName:
          type: string
        phone:
          type: string
        fulfillment:
          type: string
          enum: [DELIVERY, PICKUP]
        address:
          type: string
        reference:
          type: string
        notes:
          type: string
        paymentMethod:
          type: string
          enum: [CASH, PIX, CARD]
        deliveryFee:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        subtotal:
          type: number
        total:
          type: number
        createdAt:
          type: string
          format: date-time
      required: [id, customerName, phone, fulfillment, address, reference, notes, paymentMethod, deliveryFee, items, subtotal, total, createdAt]

